name: Preview check

# Builds and tests a pull request. It does not deploy GitHub Pages.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - name: Build static export
        run: npm run build || npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview-static
          path: out
          if-no-files-found: error
